<script id="quiz-data" type="application/json">[{"topic": "sql-joins", "difficulty": "screen", "stem": "What does an INNER JOIN return?", "options": ["Only rows that have matching values in both tables", "All rows from the left table, with NULLs where there's no match", "All rows from both tables, matched or not", "Only rows that exist in the left table but not the right"], "correct": 0, "explanation": "INNER JOIN keeps only rows where the join condition matches in both tables — non-matching rows from either side are excluded. Keeping all left rows regardless of match describes a LEFT JOIN instead."}, {"topic": "sql-joins", "difficulty": "screen", "stem": "What does a LEFT JOIN return that an INNER JOIN would not?", "options": ["All rows from the left table, even those with no matching row in the right table (right-side columns become NULL)", "Only rows with matches in the right table", "Rows sorted in descending order", "Duplicate rows for every match"], "correct": 0, "explanation": "LEFT JOIN preserves every row from the left table regardless of whether a match exists on the right, filling unmatched right-side columns with NULL — useful for 'find all X, plus any related Y if it exists' queries. Sort order is unrelated to join type; you'd need an explicit ORDER BY for that."}, {"topic": "sql-joins", "difficulty": "mid", "stem": "You LEFT JOIN orders to customers but accidentally get more order rows in the result than exist in the orders table. What's the most likely cause?", "options": ["The customers table has duplicate customer_id rows, causing each order to match multiple customer rows (a fan-out)", "LEFT JOIN always duplicates rows by definition", "The orders table has a syntax error", "This is impossible with a LEFT JOIN"], "correct": 0, "explanation": "If the 'one' side of a supposed one-to-many relationship actually has duplicate keys, each order row matches multiple customer rows, silently multiplying (fanning out) the result set — a classic join-multiplication bug worth checking for with a pre-join uniqueness check. LEFT JOIN doesn't inherently duplicate rows; it only does so when the join key isn't actually unique on the joined side, which is the real root cause here."}, {"topic": "sql-joins", "difficulty": "mid", "stem": "What is the key difference between a FULL OUTER JOIN and a LEFT JOIN?", "options": ["FULL OUTER JOIN includes unmatched rows from BOTH tables; LEFT JOIN only includes unmatched rows from the left table", "FULL OUTER JOIN and LEFT JOIN are identical in every database", "FULL OUTER JOIN never returns NULLs", "LEFT JOIN always runs faster than FULL OUTER JOIN with no exceptions"], "correct": 0, "explanation": "FULL OUTER JOIN unions the LEFT JOIN and RIGHT JOIN results — it keeps unmatched rows from either side, filling the other side's columns with NULL, whereas LEFT JOIN only protects the left table's rows. FULL OUTER JOIN typically produces MORE NULLs (from either side), not fewer — that distractor states the opposite of reality."}, {"topic": "sql-joins", "difficulty": "screen", "stem": "What does CROSS JOIN produce between two tables with M and N rows?", "options": ["Every possible combination of rows — M x N rows total (a Cartesian product)", "M + N rows", "Only matching rows, same as INNER JOIN", "An error, since CROSS JOIN requires a join condition"], "correct": 0, "explanation": "CROSS JOIN pairs every row of the first table with every row of the second, with no matching condition — producing the full Cartesian product, which can get huge fast. Unlike other join types, CROSS JOIN specifically does NOT require (or use) an ON condition, so it's syntactically valid without one."}, {"topic": "sql-joins", "difficulty": "mid", "stem": "How do you write a query that finds rows in table A that have NO matching row in table B (an 'anti-join')?", "options": ["LEFT JOIN B on the key, then WHERE B.key IS NULL", "INNER JOIN B and filter WHERE A.key = B.key", "CROSS JOIN B and filter for distinct rows", "RIGHT JOIN B with no WHERE clause"], "correct": 0, "explanation": "LEFT JOIN preserves all of A's rows and fills B's columns with NULL where there's no match; filtering for that NULL isolates exactly the unmatched A rows — the standard anti-join pattern (NOT EXISTS / NOT IN are common alternatives). An INNER JOIN filtered on matching keys does the opposite — it returns only the MATCHING rows, not the unmatched ones."}, {"topic": "sql-joins", "difficulty": "mid", "stem": "Why might putting a filter condition in the ON clause vs. the WHERE clause change results for a LEFT JOIN?", "options": ["A condition in ON filters the right table before joining (preserving unmatched left rows with NULLs); the same condition in WHERE filters AFTER the join, potentially dropping those left rows entirely", "ON and WHERE clauses are always functionally identical for any join type", "WHERE clauses cannot reference columns from the right-hand table", "Using ON instead of WHERE always makes the query run faster"], "correct": 0, "explanation": "For LEFT JOIN specifically, an ON-clause filter narrows which right-table rows are eligible to match (but still keeps every left row, with NULLs if nothing matched), while a WHERE-clause filter applies after the join completes and can eliminate left rows whose right-side columns are now NULL and fail the filter — a classic and consequential difference. WHERE clauses absolutely can reference right-table columns; that's not restricted, and the ON vs. WHERE choice is about correctness/semantics, not primarily about performance."}, {"topic": "sql-joins", "difficulty": "screen", "stem": "What is a 'self join'?", "options": ["A table joined to itself, typically to compare rows within the same table (e.g. employees to their managers)", "A join that only returns exactly one row", "A join between two completely unrelated tables", "A join that is executed twice for redundancy"], "correct": 0, "explanation": "A self join aliases the same table twice (e.g. e AS employee, m AS manager) to relate rows to other rows in that same table, common for hierarchical data like org charts. It has nothing to do with row count guarantees or query redundancy."}, {"topic": "sql-joins", "difficulty": "mid", "stem": "When joining three or more tables, why does join order sometimes matter for correctness (not just performance)?", "options": ["With outer joins mixed in, changing the order can change which rows get preserved vs. dropped, altering the actual result set, not just execution speed", "Join order never affects correctness in SQL, only execution plan speed", "SQL requires joins to be written in alphabetical table name order", "More than two tables cannot be joined in a single query"], "correct": 0, "explanation": "While the optimizer can freely reorder pure INNER JOINs, mixing in LEFT/RIGHT/FULL OUTER JOINs means the order in which NULLs get introduced can change which rows survive later filters — so with outer joins present, join order can be a correctness issue, not just an optimization detail. Multi-table joins are extremely common and there's no alphabetical-ordering requirement in SQL syntax."}, {"topic": "sql-joins", "difficulty": "tricky", "stem": "A query joins orders to a promotions table on date ranges (promo.start_date <= order.date AND promo.end_date >= order.date) instead of an equality key. Why can this silently produce duplicate order rows?", "options": ["If promotion date ranges overlap, a single order date can fall within multiple promotions, matching more than one promo row per order", "Range-condition joins are not valid SQL syntax", "This pattern always returns exactly one row per order, no matter what", "Date range joins can only be used with an INNER JOIN, never other join types"], "correct": 0, "explanation": "Unlike an equality join on a unique key, a range-based join condition can legitimately match multiple rows on the other side if the ranges overlap — each order gets fanned out once per overlapping promotion, a genuinely different failure mode from typical duplicate-key joins. Range joins are valid, common SQL (e.g. joining events to time-bucketed reference tables) and work with any join type, not just INNER JOIN."}, {"topic": "window-functions", "difficulty": "screen", "stem": "What is the key difference between a window function and a GROUP BY aggregate?", "options": ["Window functions compute aggregates per row while keeping all individual rows in the output; GROUP BY collapses rows into one row per group", "Window functions can only be used with COUNT(), never SUM() or AVG()", "GROUP BY preserves every row; window functions collapse rows", "There is no difference; they always produce identical output"], "correct": 0, "explanation": "A window function (using OVER()) computes an aggregate or ranking value that's attached back to each individual row, whereas GROUP BY reduces the whole group down to a single summary row — this is precisely why window functions are useful for 'add a running total column' style queries. Window functions work with the same aggregate functions as GROUP BY (SUM, AVG, COUNT, etc.) — they're not limited to COUNT()."}, {"topic": "window-functions", "difficulty": "screen", "stem": "What does ROW_NUMBER() OVER (PARTITION BY customer_id ORDER BY order_date) assign to each row?", "options": ["A unique sequential number within each customer's group of orders, ordered by date", "The same number to every row in the table", "A count of total customers", "A running total of order amounts"], "correct": 0, "explanation": "PARTITION BY resets the numbering for each customer group, and ORDER BY determines the sequence within that group — giving each customer's orders numbers 1, 2, 3... by date, a very common pattern for finding 'the Nth order per customer.' It assigns a per-row rank/sequence number, not an aggregate total — SUM() would be needed for a running total instead."}, {"topic": "window-functions", "difficulty": "mid", "stem": "What is the key difference between RANK() and DENSE_RANK() when there are ties?", "options": ["RANK() leaves gaps in the ranking sequence after a tie (e.g. 1,2,2,4); DENSE_RANK() does not (1,2,2,3)", "RANK() and DENSE_RANK() always produce identical output", "DENSE_RANK() can only be used without PARTITION BY", "RANK() ignores ties entirely and assigns arbitrary order"], "correct": 0, "explanation": "RANK() skips ranking numbers equal to the count of tied rows (two rows tied for 2nd means the next rank is 4, not 3), while DENSE_RANK() continues consecutively with no gaps — a subtle but frequently-tested distinction. Both functions handle ties in a well-defined, deterministic way based on the ORDER BY — 'arbitrary order' misdescribes RANK()'s actual behavior."}, {"topic": "window-functions", "difficulty": "mid", "stem": "How would you find the top 3 highest-paid employees per department using a window function?", "options": ["Use ROW_NUMBER() or RANK() PARTITION BY department ORDER BY salary DESC, then filter WHERE that rank <= 3", "Use GROUP BY department, ORDER BY salary DESC, LIMIT 3 in one query", "This can only be done with a self-join, never window functions", "Use SUM(salary) PARTITION BY department"], "correct": 0, "explanation": "Partitioning by department and ranking by salary descending lets you filter each department's own top 3 in a single pass — a canonical 'top-N per group' window function pattern (note: the rank filter typically needs a subquery/CTE since window function results can't be filtered directly in the same-level WHERE clause). A single flat GROUP BY + LIMIT 3 would only return the overall top 3 across ALL departments combined, not top 3 within each department separately."}, {"topic": "window-functions", "difficulty": "mid", "stem": "What does LAG(amount, 1) OVER (PARTITION BY customer_id ORDER BY order_date) return for each row?", "options": ["The 'amount' value from the previous row within that customer's ordered partition", "The 'amount' value from the next row", "The average amount across all of that customer's orders", "The maximum amount for that customer"], "correct": 0, "explanation": "LAG looks backward by the specified offset (here 1) within the ordered partition, commonly used to compute period-over-period differences like 'amount vs. previous order.' Looking forward instead is what LEAD does — the mirror-image function, easy to mix up with LAG."}, {"topic": "window-functions", "difficulty": "mid", "stem": "What is the purpose of a running total computed with SUM(amount) OVER (ORDER BY date ROWS BETWEEN UNBOUNDED PRECEDING AND CURRENT ROW)?", "options": ["Accumulate a cumulative sum of amount up through the current row, in date order", "Compute the total sum across the entire table, repeated on every row", "Reset to zero and restart summing after every 10 rows", "Compute the average, not the sum, despite the SUM() keyword"], "correct": 0, "explanation": "The frame clause 'UNBOUNDED PRECEDING to CURRENT ROW' explicitly defines a growing window from the start up to the current row, producing a classic running/cumulative total as you move through the ordered rows. Without that frame restriction (i.e. summing over the whole partition unbounded on both sides), you'd get the same repeated grand total on every row instead — a different, common mistake."}, {"topic": "window-functions", "difficulty": "screen", "stem": "What SQL clause distinguishes a window function call from a regular aggregate function call?", "options": ["The OVER() clause", "The GROUP BY clause", "The HAVING clause", "The DISTINCT keyword"], "correct": 0, "explanation": "Adding OVER(...) — with optional PARTITION BY / ORDER BY / frame specification — after an aggregate function is exactly what turns it into a window function operating per-row instead of collapsing rows. GROUP BY and HAVING belong to the separate aggregate-and-collapse pattern, not the window function syntax."}, {"topic": "window-functions", "difficulty": "mid", "stem": "Why can't you directly filter on a window function's result in the same query's WHERE clause (e.g. WHERE ROW_NUMBER() OVER (...) = 1)?", "options": ["Window functions are evaluated after the WHERE clause in SQL's logical processing order, so the WHERE clause can't reference their results yet — a subquery or CTE is needed instead", "This restriction doesn't actually exist in any SQL database", "Window functions can only be used in the SELECT list, never anywhere else at all", "WHERE clauses cannot contain any function calls of any kind"], "correct": 0, "explanation": "SQL's logical query processing order evaluates WHERE before SELECT (where window functions are computed), so you must wrap the windowed query in a subquery/CTE and filter in an outer WHERE clause against the now-materialized window function column. Window functions CAN appear in ORDER BY too (and in some databases, QUALIFY), so 'only SELECT' isn't accurate either."}, {"topic": "window-functions", "difficulty": "mid", "stem": "What is the practical use of NTILE(4) OVER (ORDER BY revenue)?", "options": ["Splits the ordered rows into 4 roughly equal-sized buckets (quartiles), e.g. for revenue quartile analysis", "Returns the 4th row in the ordered result set", "Multiplies revenue by 4 for each row", "Filters to only rows where revenue is in the top 4"], "correct": 0, "explanation": "NTILE(n) divides the ordered partition into n as-equal-as-possible groups and labels each row with its bucket number (1 to n) — commonly used for quartile/decile/percentile-bucket analysis. It's a bucketing function, not a row-selection or arithmetic-multiplication operation."}, {"topic": "window-functions", "difficulty": "tricky", "stem": "You use FIRST_VALUE(amount) OVER (PARTITION BY customer_id ORDER BY order_date) but get an unexpected result: it seems to change value partway through each customer's rows instead of staying fixed at the first order's amount. What's the likely cause?", "options": ["The default window frame with ORDER BY is 'RANGE BETWEEN UNBOUNDED PRECEDING AND CURRENT ROW', so FIRST_VALUE is being recomputed relative to a frame that changes per row in some edge cases — an explicit frame clause avoids ambiguity", "FIRST_VALUE always returns a different, undefined result and should never be used", "This is expected: FIRST_VALUE is supposed to return the current row's own value, not the first row's", "PARTITION BY cannot be combined with ORDER BY in the same OVER() clause"], "correct": 0, "explanation": "When ORDER BY is present without an explicit ROWS/RANGE frame, most databases default to a frame ending at CURRENT ROW rather than the full partition — for FIRST_VALUE this default is usually fine (the first value in the growing frame is still the true first row), but this default frame behavior is a frequent source of confusing window function bugs (especially for LAST_VALUE, which is famously affected by it) and worth understanding explicitly. PARTITION BY and ORDER BY are routinely and correctly combined together in the same OVER() clause — that combination is completely standard, not restricted."}, {"topic": "dedup", "difficulty": "screen", "stem": "What does SELECT DISTINCT do in SQL?", "options": ["Removes duplicate rows from the result set, keeping only unique combinations of the selected columns", "Removes duplicate rows based only on the primary key, ignoring other columns", "Sorts the result set alphabetically", "Deletes duplicate rows from the underlying table"], "correct": 0, "explanation": "DISTINCT operates on the full set of selected columns — two rows are only deduplicated if ALL selected columns match exactly. It's a read-time deduplication of the result set only; it never modifies or deletes anything in the underlying table."}, {"topic": "dedup", "difficulty": "mid", "stem": "How would you deduplicate rows in a table, keeping only the most recent record per unique key (e.g. latest update per user_id)?", "options": ["Use ROW_NUMBER() PARTITION BY user_id ORDER BY updated_at DESC, then filter to row number 1", "Use SELECT DISTINCT user_id, which automatically keeps the latest row", "GROUP BY user_id always keeps the most recent row by default", "This cannot be done in SQL without exporting to another tool"], "correct": 0, "explanation": "Ranking each user's rows by recency and keeping only rank 1 is the standard 'latest record per key' deduplication pattern in SQL. SELECT DISTINCT has no concept of 'most recent' — it just deduplicates identical rows/column combinations, with no ordering logic applied at all."}, {"topic": "dedup", "difficulty": "mid", "stem": "What is a common cause of unexpected duplicate rows appearing after a join that the source tables individually don't have?", "options": ["A one-to-many (or many-to-many) relationship between the joined tables causes each 'one' side row to appear once per matching row on the 'many' side", "Joins can never introduce duplicates that weren't already in the source tables", "DISTINCT is required syntax on every join or it will error", "Duplicate rows after a join always indicate corrupted source data"], "correct": 0, "explanation": "If the join key isn't unique on one side (e.g. a customer with multiple orders joined to a customer info table), each match multiplies rows on the other side — the join is working correctly, but the cardinality assumption about the relationship was wrong. Joins routinely and correctly introduce this kind of row multiplication when relationships are genuinely one-to-many — it doesn't imply corrupted data, just a fan-out you need to account for."}, {"topic": "dedup", "difficulty": "mid", "stem": "Why is COUNT(DISTINCT user_id) different from COUNT(user_id) on a table with repeated user visits?", "options": ["COUNT(DISTINCT ...) counts unique users; COUNT(...) counts every row (every visit), including repeats from the same user", "They are always identical for any column", "COUNT(DISTINCT ...) ignores NULL differently than COUNT(...) in the opposite direction", "COUNT(user_id) only works on numeric columns"], "correct": 0, "explanation": "COUNT(DISTINCT user_id) collapses repeat visits from the same user into one count (unique visitors), while plain COUNT(user_id) counts every non-null row (total visit events) — mixing these up is a very common analytics bug when someone wants 'users' but writes 'rows'. Both variants actually exclude NULLs from the count the same way — that's not the distinguishing factor between them."}, {"topic": "dedup", "difficulty": "mid", "stem": "What is the risk of using DELETE with a self-join or subquery to remove 'duplicate' rows without a clear tiebreaker (like a timestamp or row ID)?", "options": ["Without a deterministic tiebreaker, you might accidentally delete the wrong copy, or all copies, of a set of duplicate rows", "DELETE statements can never reference a subquery", "This approach always deletes exactly one row per group safely by default", "Deduplication via DELETE is always faster than any other method"], "correct": 0, "explanation": "If your dedup logic doesn't unambiguously pick which duplicate to keep (e.g. by explicit row ID or timestamp with a tiebreaker for exact ties), you risk deleting the wrong record or, in a poorly-written self-join, deleting both/all copies of a duplicate pair — a genuinely destructive and hard-to-undo mistake. DELETE statements absolutely can reference subqueries in most SQL dialects — that's a standard, supported pattern, not a restriction."}, {"topic": "dedup", "difficulty": "tricky", "stem": "A table has exact duplicate rows (every column identical, no unique ID column exists) and you need to keep just one copy of each. Since there's no unique key to filter on, what's a reliable SQL approach?", "options": ["Use ROW_NUMBER() OVER (PARTITION BY <all columns> ORDER BY (SELECT NULL)) and delete/keep only row number 1 per partition", "This is impossible in SQL without adding a new ID column first", "GROUP BY all columns automatically deletes the extra copies from the table", "SELECT DISTINCT will permanently remove the duplicates from the underlying table"], "correct": 0, "explanation": "Partitioning by every column (treating the full row as the dedup key) with an arbitrary tiebreaker ORDER BY still lets ROW_NUMBER() assign a distinguishing sequence to otherwise-identical rows, which you can then filter or delete against — a workable approach even with no natural ID. GROUP BY (and SELECT DISTINCT) only affect a query's RESULT SET — neither one ever modifies or deletes rows from the actual underlying table."}, {"topic": "aggregation-traps", "difficulty": "screen", "stem": "Why does AVG() silently ignore NULL values instead of treating them as 0?", "options": ["NULL represents 'unknown/missing', and averaging it as 0 would incorrectly pull the average down by counting missing data as a real zero value", "AVG() always errors out when NULLs are present in the column", "NULL and 0 are treated identically by every SQL aggregate function", "AVG() requires you to manually filter NULLs first or it returns NULL for the entire result"], "correct": 0, "explanation": "SQL's NULL-handling convention treats NULL as 'unknown', so aggregate functions like AVG() and SUM() exclude NULL rows from their calculation rather than assuming they represent zero — conflating 'missing' with 'zero' would badly distort the true average. This exclusion happens automatically; you don't need to manually filter NULLs out first for AVG() to work correctly on non-null values."}, {"topic": "aggregation-traps", "difficulty": "mid", "stem": "What is the difference between COUNT(*) and COUNT(column_name)?", "options": ["COUNT(*) counts all rows regardless of NULLs; COUNT(column_name) counts only rows where that specific column is non-null", "They are always exactly identical in every case", "COUNT(*) only works with an accompanying GROUP BY clause", "COUNT(column_name) counts distinct values automatically"], "correct": 0, "explanation": "COUNT(*) counts rows outright, while COUNT(column) skips rows where that column is NULL — a subtle but important difference that can silently produce different totals if the column has missing values. COUNT(column) does NOT deduplicate automatically — you'd need COUNT(DISTINCT column) explicitly to count only unique values."}, {"topic": "aggregation-traps", "difficulty": "mid", "stem": "You compute AVG(order_value) per day, then average those daily averages to get an overall average. Why can this differ from AVG(order_value) computed directly across all orders?", "options": ["Averaging averages weights each day equally regardless of how many orders it had, whereas a direct overall average weights every individual order equally", "Averaging averages and direct averaging are mathematically guaranteed to always produce the same result", "This only happens if the data contains negative values", "SQL does not allow computing an average of already-averaged values"], "correct": 0, "explanation": "If a low-volume day (say, 2 orders) and a high-volume day (say, 2000 orders) both count as '1 data point' when you average the daily averages, that low-volume day's average gets disproportionately more influence than it would in a direct per-order average — the classic 'average of averages' trap in reporting. There's no restriction against computing an average of averages in SQL — it's a perfectly valid (if often misleading) calculation."}, {"topic": "aggregation-traps", "difficulty": "mid", "stem": "What does the SQL logical processing order tell you about why you can't use a column alias defined in SELECT within the same query's WHERE clause?", "options": ["WHERE is logically evaluated before SELECT, so the alias doesn't exist yet at that point in processing", "Aliases are never allowed anywhere in SQL", "WHERE and SELECT are evaluated simultaneously, causing a race condition", "This restriction only applies to Oracle, not other databases"], "correct": 0, "explanation": "SQL's logical order is roughly FROM -> WHERE -> GROUP BY -> HAVING -> SELECT -> ORDER BY, so any alias created in SELECT simply doesn't exist yet when WHERE is evaluated — this is exactly why HAVING (evaluated after grouping) can sometimes reference aggregate results that WHERE cannot. This processing-order behavior is part of the general SQL standard, consistently followed (with query-specific syntax variations) across major relational databases, not an Oracle-specific quirk."}, {"topic": "aggregation-traps", "difficulty": "mid", "stem": "Why must every non-aggregated column in the SELECT list also appear in the GROUP BY clause (in standard SQL)?", "options": ["Without grouping by it, SQL wouldn't know which single value to display for that column since each group could contain many different values for it", "GROUP BY is purely cosmetic and doesn't actually affect which columns can be selected", "This rule only applies to MySQL, no other database enforces it", "Aggregated and non-aggregated columns can always be freely mixed with no restriction"], "correct": 0, "explanation": "If a column isn't part of the GROUP BY key and isn't wrapped in an aggregate, a group could span multiple different values for it — SQL requires you to either aggregate it (MIN/MAX/etc.) or group by it explicitly, since there's no well-defined single value to show otherwise. Standard SQL enforces this broadly (some databases like older MySQL historically allowed non-standard exceptions with unpredictable results), so it's a general relational rule, not one confined to a single vendor."}, {"topic": "aggregation-traps", "difficulty": "mid", "stem": "What's the difference between filtering with WHERE vs. HAVING when using GROUP BY?", "options": ["WHERE filters individual rows before grouping; HAVING filters groups after aggregation, so only HAVING can reference aggregate function results directly", "WHERE and HAVING are fully interchangeable in every context", "HAVING must always come before WHERE in the query", "WHERE can filter on aggregate values just as well as HAVING"], "correct": 0, "explanation": "WHERE operates on raw rows before any grouping/aggregation happens, so it can't reference something like SUM(amount) that doesn't exist yet at that stage; HAVING runs after grouping specifically to filter on aggregate results, e.g. HAVING SUM(amount) > 1000. WHERE genuinely cannot reference aggregate function results — attempting SUM(amount) in a WHERE clause is a common error precisely because aggregation hasn't happened yet at that stage."}, {"topic": "aggregation-traps", "difficulty": "tricky", "stem": "A query computes SUM(revenue) grouped by month, joined from an orders table to a refunds table via LEFT JOIN. Revenue totals come out higher than expected. What's the likely bug?", "options": ["The LEFT JOIN to refunds fanned out orders with multiple refund rows, causing each order's revenue to be double-counted once per matching refund row", "SUM() always overcounts by definition when used with GROUP BY", "LEFT JOIN can never be combined with SUM() and GROUP BY safely", "Refund rows automatically get added to revenue instead of subtracted"], "correct": 0, "explanation": "If an order has multiple refund rows (e.g. partial refunds), the LEFT JOIN duplicates that order's revenue row once per refund match, so SUM(revenue) counts the same order's revenue multiple times — a classic join-fan-out-then-aggregate bug, usually fixed by pre-aggregating refunds to one row per order before joining. There is nothing inherently unsafe about combining LEFT JOIN with SUM()/GROUP BY — it's an extremely common, valid pattern; the actual bug here is the fan-out from a non-unique join key, not the combination of clauses itself."}, {"topic": "aggregation-traps", "difficulty": "mid", "stem": "Why can rounding intermediate aggregated values (e.g. rounding a monthly average before summing across months) introduce small but compounding errors?", "options": ["Each rounding step discards a bit of precision, and those small errors can accumulate across many aggregation steps into a larger discrepancy from the true unrounded total", "Rounding never affects SUM() or AVG() results in any database", "SQL automatically prevents rounding errors from compounding", "This only matters for values greater than one million"], "correct": 0, "explanation": "Rounding at each intermediate stage throws away a small amount of precision each time, and while any single rounding error is tiny, summing many rounded values can accumulate a meaningfully larger drift than rounding only the final result once — a real concern in financial/precision-sensitive reporting pipelines. This compounding effect can matter at any magnitude of values, not just numbers above some arbitrary million-scale threshold."}, {"topic": "etl", "difficulty": "screen", "stem": "What does ETL stand for, and what is the general order of operations?", "options": ["Extract, Transform, Load — pull data from a source, reshape/clean it, then write it into the target system", "Encode, Transfer, Log — compress data, send it, then record the transfer", "Evaluate, Test, Launch — a software deployment process, not a data process", "Export, Trigger, Listen — an event-driven messaging pattern"], "correct": 0, "explanation": "ETL describes pulling raw data from source systems, applying transformations/cleaning/business logic, and then loading the result into a destination (warehouse, database, etc.) — the classic data integration pattern. It's a data pipeline concept, unrelated to software deployment processes or generic messaging patterns despite the similar-sounding acronym structure of the distractors."}, {"topic": "etl", "difficulty": "mid", "stem": "What is the key structural difference between ETL and ELT (Extract, Load, Transform)?", "options": ["ELT loads raw data into the destination first and transforms it there (often using the warehouse's own compute), rather than transforming before loading", "ELT skips the extraction step entirely", "ETL and ELT are exactly the same process with different names", "ELT can only be used with NoSQL databases"], "correct": 0, "explanation": "ELT pushes transformation work into the destination system (leveraging modern cloud warehouses' scalable compute) after loading raw data, whereas classical ETL transforms data in a separate processing layer before it ever reaches the destination — a shift enabled by cheaper cloud warehouse compute. ELT still requires extraction as the first step, exactly like ETL — it's the order of load vs. transform that differs, not whether extraction happens."}, {"topic": "etl", "difficulty": "mid", "stem": "Why is idempotency (the ability to safely rerun a pipeline step without duplicating or corrupting data) an important property for ETL jobs?", "options": ["Pipeline failures and retries are common in production, and a non-idempotent job could double-load or corrupt data if rerun after a partial failure", "Idempotency is only relevant for streaming pipelines, never batch ETL", "Idempotent jobs always run faster than non-idempotent ones", "Idempotency means the job produces a different result every time it's run"], "correct": 0, "explanation": "Real pipelines fail and get retried (network blips, transient errors) — an idempotent job (e.g. using upserts/merge instead of blind appends) can be safely rerun and land in the same correct end state, while a non-idempotent one might double-count data on retry. It's just as important for scheduled batch ETL as for streaming — retries and reruns happen in both paradigms, and idempotency specifically means the result stays the SAME (not different) no matter how many times you rerun it."}, {"topic": "etl", "difficulty": "mid", "stem": "What is the purpose of a 'staging' layer/table in a typical ETL/ELT architecture?", "options": ["Hold raw or lightly-processed data temporarily before further transformation, isolating the messy source format from clean downstream models", "Permanently store the final, production-ready reporting tables", "Replace the need for a data warehouse entirely", "Serve real-time queries directly to end-user dashboards"], "correct": 0, "explanation": "Staging tables act as a landing zone that mirrors the source data closely, giving transformations a stable, isolated starting point and making it easier to reprocess or debug without re-hitting the original source system. It's an intermediate layer, not the final destination — that's typically a separate set of cleaned, modeled tables built ON TOP of staging."}, {"topic": "etl", "difficulty": "mid", "stem": "What is 'schema drift' in the context of an ETL pipeline ingesting from an external source?", "options": ["The source system's data structure (columns, types) changes unexpectedly over time, potentially breaking downstream transformations if not handled", "The pipeline's schedule slowly drifts later each day due to system clock issues", "A deliberate, planned change to the warehouse schema by the data team", "A type of database index used for schema versioning"], "correct": 0, "explanation": "Upstream systems evolve — a column gets renamed, a new field appears, a type changes — and if the pipeline assumes a fixed schema, an unannounced upstream change ('schema drift') can silently corrupt data or break the job outright, which is why schema validation/monitoring is a common ETL safeguard. It refers to unplanned, often unannounced structural changes from an external source — the opposite of a deliberate, planned internal schema change."}, {"topic": "etl", "difficulty": "screen", "stem": "What is 'incremental load' in ETL, as opposed to a 'full load'?", "options": ["Only processing new or changed records since the last run, instead of reprocessing the entire dataset every time", "Loading data one row at a time instead of in batches", "Loading data only during off-peak hours", "Splitting the load across multiple destination databases"], "correct": 0, "explanation": "Incremental loads track a watermark (e.g. last updated timestamp or an incrementing ID) to pull only what's new/changed, which is far more efficient than a full reload for large, frequently-updated source tables. It's about WHAT data gets processed (new/changed vs. everything), not about the physical batching granularity or the time of day the job runs."}, {"topic": "etl", "difficulty": "mid", "stem": "Why do production ETL pipelines typically include data validation checks (e.g. row count sanity checks, null rate thresholds) as a distinct pipeline step?", "options": ["To catch upstream data quality issues or pipeline bugs before bad data propagates downstream into reports and models", "Validation checks are only useful during initial pipeline development, not in production", "They are legally required for every data pipeline", "Validation checks replace the need for any transformation logic"], "correct": 0, "explanation": "Automated checks (row counts within expected bounds, key columns not suddenly all-null, referential integrity holding) act as a tripwire that halts or flags a pipeline before corrupted or incomplete data silently flows into dashboards and downstream models. These checks are just as valuable (arguably more so) in production, where undetected issues have real business impact, not merely a development-phase concern."}, {"topic": "etl", "difficulty": "mid", "stem": "What does 'backfilling' refer to in a data pipeline context?", "options": ["Reprocessing historical data through the pipeline, e.g. after fixing a bug or adding a new transformation that should apply retroactively", "Filling NULL values with a default value at query time", "Adding new columns to the end of an existing table", "Automatically archiving old data to cold storage"], "correct": 0, "explanation": "Backfilling reruns the pipeline logic against past date ranges — common after discovering a transformation bug or needing a new metric calculated for historical periods too, not just going forward. It's specifically about reprocessing through the actual ETL logic, distinct from a simple query-time NULL substitution or unrelated table/storage-management operations."}, {"topic": "etl", "difficulty": "mid", "stem": "Why is it generally considered bad practice for a transformation step to silently drop or coerce rows that fail a data type check, without logging or alerting?", "options": ["Silent data loss makes downstream numbers subtly wrong with no visible signal that anything is missing, making the issue very hard to detect and debug later", "Dropping bad rows is always the mathematically correct thing to do", "Logging failed rows always slows down the pipeline unacceptably", "Data type checks are unnecessary if the source system is trusted"], "correct": 0, "explanation": "Silently dropping problem rows means downstream reports/models are quietly missing data with no trace of what happened or why — far worse than a loud failure, since nobody knows to investigate; the better practice is logging/quarantining bad rows with visibility into the failure. Even a generally trusted source system can occasionally send malformed data (schema drift, transient bugs), so skipping validation checks entirely is risky regardless of source trust."}, {"topic": "etl", "difficulty": "tricky", "stem": "An ETL job uses a naive 'DELETE all rows for today, then INSERT fresh data for today' pattern to handle reruns. What's the risk if the job fails partway through, after the DELETE but before the INSERT completes?", "options": ["Today's data is left completely missing (deleted but not yet reloaded) until the next successful run, causing a visible data gap in the interim", "There is no risk; the pattern is fully safe under any failure scenario", "The DELETE automatically rolls back if the INSERT fails, guaranteeing no data loss", "This pattern guarantees idempotency and is the recommended best practice"], "correct": 0, "explanation": "Unless the DELETE and INSERT are wrapped in a single atomic transaction (and even then, only within one database that supports it), a mid-job failure between them leaves a real gap — today's data is gone until the job successfully completes end to end — which is exactly why safer patterns like INSERT into a new partition/table and atomic swap, or MERGE/upsert, are often preferred. Whether the DELETE auto-rolls-back entirely depends on transaction boundaries and database support — it's not a guarantee inherent to this delete-then-insert pattern, which is precisely why it's considered risky rather than a recommended best practice."}, {"topic": "lake-vs-warehouse", "difficulty": "screen", "stem": "What is a key structural difference between a data lake and a data warehouse?", "options": ["A data lake stores raw data in its native format (structured, semi-structured, unstructured); a warehouse stores structured, schema-enforced data optimized for querying", "A data lake can only store CSV files; a warehouse can store any format", "Data warehouses cannot be queried with SQL", "Data lakes are always more expensive to operate than warehouses"], "correct": 0, "explanation": "Data lakes embrace schema flexibility and diverse raw formats (logs, images, JSON, Parquet, etc.), while warehouses enforce a defined schema and columnar structure optimized specifically for fast analytical SQL queries. Modern data warehouses (Snowflake, BigQuery, Redshift) are very much SQL-first systems — SQL querying is actually their defining strength, not something they lack."}, {"topic": "lake-vs-warehouse", "difficulty": "mid", "stem": "What does 'schema-on-read' (associated with data lakes) mean, as opposed to 'schema-on-write' (associated with warehouses)?", "options": ["The data's structure/schema is interpreted at query time rather than being enforced when the data is first written", "Schema-on-read means data can never be queried with SQL", "Schema-on-write means the schema changes automatically every time new data is written", "There is no practical difference between the two approaches"], "correct": 0, "explanation": "Schema-on-read stores raw data without enforcing structure upfront, deferring interpretation to whoever queries it later — flexible but riskier since inconsistent raw data isn't caught until query time; schema-on-write validates and enforces structure immediately at ingestion. Schema-on-read data (e.g. in a data lake) is absolutely still queryable with SQL, typically via query engines designed for that purpose (e.g. Presto, Athena, Spark SQL) — that's a core lake use case, not something it lacks."}, {"topic": "lake-vs-warehouse", "difficulty": "mid", "stem": "What problem do table formats like Delta Lake, Iceberg, or Hudi solve for data lakes?", "options": ["They add warehouse-like features — ACID transactions, schema enforcement, time travel — on top of raw file storage in a lake", "They convert a data lake into a NoSQL document database", "They eliminate the need to ever delete or update data", "They are purely visualization/BI tools with no storage function"], "correct": 0, "explanation": "These 'lakehouse' table formats bring transactional guarantees, schema evolution/enforcement, and versioning/time-travel capabilities to files sitting in cheap object storage — narrowing the historical gap between raw lakes and structured warehouses. They're a metadata/storage layer for managing tabular data reliably, not a document-database conversion or a BI/visualization product."}, {"topic": "lake-vs-warehouse", "difficulty": "mid", "stem": "Why might a 'data lakehouse' architecture appeal to teams that need both cheap raw storage AND reliable structured analytics?", "options": ["It combines a lake's low-cost, flexible raw storage with warehouse-like transactional/query guarantees on top, avoiding maintaining two entirely separate systems", "Lakehouses are always cheaper than both a lake and a warehouse combined, with no tradeoffs", "A lakehouse eliminates the need for any ETL/ELT processing", "Lakehouses can only store numeric data, not text or images"], "correct": 0, "explanation": "The lakehouse pitch is unifying the cost/flexibility benefits of object storage with the ACID/schema/performance guarantees traditionally only available in warehouses, reducing the operational overhead of syncing data between two separate systems. It doesn't eliminate the need for transformation/processing logic — data still needs to be cleaned and modeled; the architecture changes WHERE that happens, not whether it's needed at all."}, {"topic": "lake-vs-warehouse", "difficulty": "mid", "stem": "Why is a data lake generally a poor fit for serving fast, interactive BI dashboard queries directly against raw files, compared to a warehouse?", "options": ["Warehouses use optimized columnar storage and indexing/statistics specifically built for fast aggregation queries, while scanning raw lake files is typically slower for that workload", "Data lakes cannot be queried at all without first exporting to CSV", "BI tools are technically incompatible with any lake-based storage format", "Warehouses store less data than lakes, making queries faster only due to smaller size"], "correct": 0, "explanation": "Warehouses are purpose-built with columnar storage, statistics, and query optimizers tuned for exactly this kind of repeated aggregation workload, while raw file scanning over a lake (even with modern engines) is often comparatively slower for latency-sensitive interactive dashboards — hence the common pattern of an ETL/ELT step that lands curated, dashboard-ready data in a warehouse. This isn't about which one holds LESS data — warehouses aren't inherently smaller; the speed difference comes from storage/indexing design, not raw data volume."}, {"topic": "lake-vs-warehouse", "difficulty": "screen", "stem": "What kind of data is a data lake generally better suited to store than a traditional data warehouse?", "options": ["Unstructured or semi-structured data like raw logs, images, or JSON blobs alongside structured tables", "Only perfectly clean, tabular, pre-aggregated reporting tables", "Data that will never be queried again", "Only data smaller than 1GB in total size"], "correct": 0, "explanation": "A lake's schema flexibility makes it a natural home for diverse raw formats a rigid warehouse schema would struggle to accommodate directly — images, unstructured logs, nested JSON, and more, alongside eventually-structured tabular data too. Lakes are commonly used at massive scale (far beyond 1GB) and specifically to retain data for later analysis, not data that will 'never be queried again.'"}, {"topic": "lake-vs-warehouse", "difficulty": "mid", "stem": "What is a 'data mart' in relation to a data warehouse?", "options": ["A smaller, subject-specific subset of a warehouse's data, tailored for a particular team or business function (e.g. a marketing data mart)", "A physical retail location where a company sells data", "A synonym for data lake with no real distinction", "A tool used exclusively for data ingestion, not storage"], "correct": 0, "explanation": "Data marts are scoped-down, often denormalized views/subsets of the broader warehouse, curated for a specific department's needs — narrower in scope than the full enterprise warehouse, but built on top of (or feeding from) it. It's a genuinely distinct architectural concept from a data lake — not just an alternate name for the same thing — describing subject-area scoping within the warehouse ecosystem specifically."}, {"topic": "lake-vs-warehouse", "difficulty": "mid", "stem": "Why might storage costs be a major factor pushing teams toward keeping raw historical data in a lake rather than a warehouse?", "options": ["Object storage underlying data lakes is typically much cheaper per gigabyte than warehouse-native storage, making it economical to retain large volumes of raw/rarely-queried data", "Warehouses cannot store more than a few gigabytes of data total", "Lakes charge based on number of queries, not storage volume, so cost is never a factor", "Storage cost has no bearing on this architectural decision at all"], "correct": 0, "explanation": "Cloud object storage (S3, GCS, ADLS) underlying most data lakes is generally priced far cheaper per GB than a warehouse's optimized storage/compute-coupled pricing, making it economically sensible to park bulk raw or infrequently-accessed historical data there and only load curated, frequently-queried data into the pricier warehouse. Modern cloud warehouses can and do scale to petabytes — the constraint isn't a hard size ceiling, it's the relative cost-per-GB difference driving this particular architectural choice."}, {"topic": "batch-vs-streaming", "difficulty": "screen", "stem": "What is the fundamental difference between batch processing and stream processing?", "options": ["Batch processes data in discrete, scheduled chunks (e.g. hourly/daily); streaming processes data continuously as individual events arrive", "Batch processing is always faster than streaming for any workload", "Streaming can only handle numeric data, not text", "Batch processing requires no scheduling at all"], "correct": 0, "explanation": "Batch jobs collect data over a window and process it all together on a schedule (or trigger), while streaming systems process each event (or micro-batch) as close to real time as the data arrives. Streaming is specifically built for LOW latency, near-immediate processing — it's typically FASTER (lower latency) than batch for time-sensitive use cases, the opposite of what that distractor claims."}, {"topic": "batch-vs-streaming", "difficulty": "mid", "stem": "When is batch processing generally a better fit than streaming for a given use case?", "options": ["When near-real-time results aren't required and the workload benefits from processing large volumes together on a schedule (e.g. nightly reporting)", "Batch is always strictly better than streaming for every use case, with no tradeoffs", "Batch can only be used for data smaller than 1000 rows", "Streaming cannot be used with SQL-like query interfaces at all"], "correct": 0, "explanation": "If a business need tolerates hours-old data (like a daily executive report) and benefits from bulk, potentially cheaper/simpler processing, batch is usually simpler to build and operate than a streaming pipeline; streaming earns its added complexity when true low-latency freshness matters. Batch is simpler for some use cases, but for latency-sensitive needs (fraud detection, live dashboards) streaming is clearly the better fit — 'always strictly better' overstates a genuine tradeoff as an absolute."}, {"topic": "batch-vs-streaming", "difficulty": "mid", "stem": "What does 'event time' vs. 'processing time' distinguish in a streaming system?", "options": ["Event time is when the event actually occurred at the source; processing time is when the streaming system actually processes it, which can lag behind due to network/system delays", "They are always identical and interchangeable in streaming systems", "Event time only applies to batch jobs, not streaming", "Processing time refers to how long the entire pipeline took to build"], "correct": 0, "explanation": "Because of network delays, out-of-order delivery, or system backpressure, an event can be processed noticeably later than when it actually happened — distinguishing event time from processing time is critical for correctly windowing and aggregating late-arriving data. These two can diverge significantly in real systems (that's exactly why the distinction matters and windowing/watermark strategies exist) — they are not simply interchangeable."}, {"topic": "batch-vs-streaming", "difficulty": "mid", "stem": "What is a 'watermark' used for in stream processing systems (e.g. Flink, Spark Structured Streaming)?", "options": ["A heuristic marking the point up to which the system believes all events (by event time) have arrived, used to decide when to finalize a windowed aggregation despite possible late data", "A digital signature verifying data hasn't been tampered with", "A visual overlay added to output dashboards for branding", "A hard guarantee that literally zero late events can ever arrive after it"], "correct": 0, "explanation": "Watermarks let a streaming system make a practical tradeoff — decide 'we've probably seen everything up to time T, let's finalize this window's result' — balancing latency against completeness, since waiting forever for every possible late event isn't practical. Watermarks are explicitly a heuristic/tradeoff mechanism, not an ironclad guarantee — systems typically still have some strategy (like allowed lateness) for handling events that arrive after the watermark anyway."}, {"topic": "batch-vs-streaming", "difficulty": "mid", "stem": "What does 'exactly-once' processing semantics mean in a streaming pipeline, and why is it hard to guarantee?", "options": ["Each event's effect is applied exactly one time even across failures/retries, which is difficult because distributed systems naturally tend toward at-least-once or at-most-once delivery without extra coordination", "It means the pipeline can only ever process exactly one event total, then stops", "It's trivially guaranteed by default in every streaming framework with zero extra effort", "It refers to running the pipeline exactly once per calendar day"], "correct": 0, "explanation": "Network failures and retries naturally lead to either duplicate delivery (at-least-once) or potential data loss (at-most-once) unless the system does extra work (idempotent writes, transactional commits, deduplication) to stitch together true exactly-once guarantees end to end — genuinely one of the harder problems in distributed streaming systems. It requires deliberate engineering effort (checkpointing, idempotent sinks, transactional writes) — it is decidedly not a free, automatic default in most systems."}, {"topic": "batch-vs-streaming", "difficulty": "screen", "stem": "What is a common example of a 'micro-batch' processing approach (a hybrid between pure batch and pure streaming)?", "options": ["Processing small batches of data at short, frequent intervals (e.g. every few seconds), like classic Spark Streaming's DStream model", "Processing exactly one row at a time with zero buffering whatsoever", "Running one enormous batch job covering an entire year of data at once", "A synonym for a fully batch, once-daily ETL job"], "correct": 0, "explanation": "Micro-batching processes small chunks of accumulated data on a very short interval, offering lower latency than traditional hourly/daily batch jobs while retaining some of batch processing's simpler execution model, compared to true per-event streaming. True per-event, zero-buffering processing describes native/continuous streaming instead, a stricter and architecturally different approach than the buffered micro-batch model."}, {"topic": "batch-vs-streaming", "difficulty": "mid", "stem": "Why might a fraud detection system specifically require streaming rather than nightly batch processing?", "options": ["Fraudulent transactions need to be flagged and potentially blocked within seconds, which a once-daily batch job's inherent latency cannot support", "Batch processing cannot mathematically detect fraud patterns at all", "Streaming systems are always cheaper to run than batch systems", "Fraud detection models can only be trained using streaming data, never historical batch data"], "correct": 0, "explanation": "The business requirement — stopping a fraudulent transaction before it completes — has a hard low-latency constraint that a job running once every 24 hours simply cannot meet, regardless of how accurate its detection logic is. Model training is a completely separate concern from serving/inference latency — fraud models are very commonly trained in batch on historical data, then deployed for real-time streaming inference, not restricted to streaming training data."}, {"topic": "batch-vs-streaming", "difficulty": "tricky", "stem": "A team migrates a batch aggregation job to a streaming pipeline, and daily totals now sometimes differ slightly from the old batch numbers even on the same underlying data. What's a plausible, non-bug explanation?", "options": ["Streaming windowing decisions (watermarks, late-arriving events, event-time vs. processing-time boundaries) can legitimately draw a day's boundary slightly differently than a batch job that waits for all data before running", "Streaming pipelines are fundamentally incapable of producing correct aggregate totals, ever", "Any discrepancy always indicates a bug that must be found and fixed immediately", "Batch and streaming systems always produce byte-for-byte identical results by mathematical necessity"], "correct": 0, "explanation": "A batch job typically runs after a full day's data has definitely landed, giving it a clean, complete boundary; a streaming job has to make a real-time tradeoff about when to 'close' a day's window given watermarks and potential late data, which can legitimately shift a small number of borderline-timestamp events across the boundary compared to batch's after-the-fact certainty. This kind of small discrepancy is a well-understood, common, and often acceptable characteristic of the batch/streaming architectural tradeoff — not automatically evidence of a bug requiring investigation."}, {"topic": "data-quality", "difficulty": "screen", "stem": "What is a 'null rate check' as a basic data quality validation?", "options": ["Verifying the percentage of NULL values in a column stays within an expected range, flagging unexpected spikes", "Checking that a column contains zero NULL values under all circumstances", "A check that only applies to numeric columns", "A check performed only once, at initial table creation"], "correct": 0, "explanation": "Null rate checks compare the current run's null percentage against a historical baseline or threshold, catching cases where an upstream change or bug suddenly causes many more (or fewer) nulls than expected — some columns are legitimately allowed a nonzero null rate. Requiring literally zero nulls would be far too strict for most real-world columns (e.g. an optional 'middle_name' field) and isn't what this general-purpose check enforces."}, {"topic": "data-quality", "difficulty": "mid", "stem": "What does a 'referential integrity' check verify in a data pipeline (e.g. checking that every order's customer_id exists in the customers table)?", "options": ["That foreign key relationships are actually valid — no 'orphan' rows referencing a non-existent parent record", "That all column names match a predefined naming convention", "That numeric columns don't contain negative values", "That the pipeline runs within its scheduled time window"], "correct": 0, "explanation": "Referential integrity checks catch orphaned foreign keys (like an order pointing to a customer_id that doesn't exist in the customers table) — often caused by out-of-sync loads or upstream deletions — which can silently break downstream joins. It's specifically about relationships between tables, distinct from naming-convention linting, value-range checks, or pipeline scheduling/SLA monitoring, which are separate quality concerns."}, {"topic": "data-quality", "difficulty": "mid", "stem": "What is the purpose of a 'row count reconciliation' check between a source system and the destination after a data load?", "options": ["Confirm the expected number of rows actually made it through the pipeline, catching silent partial loads or unexpected row duplication", "Ensure the destination table always has more rows than the source table", "Verify that column data types match exactly", "Check that the query ran in under a fixed time limit"], "correct": 0, "explanation": "Comparing source and destination row counts (accounting for expected filters/dedup) is a simple but effective tripwire for a job that silently failed partway through, double-loaded data, or dropped rows due to a bug — catching the loss before it's discovered much later downstream. There's no expectation that destination row counts should always exceed source counts — for most straightforward loads, matching counts (not growing ones) is exactly what indicates a successful, complete load."}, {"topic": "data-quality", "difficulty": "mid", "stem": "What does a 'freshness' or 'staleness' check monitor in a data pipeline?", "options": ["Whether data has actually been updated as recently as expected, catching pipelines that silently stopped running or are stuck on old data", "Whether the data conforms to a specific date format string", "The color-coding used in a BI dashboard for visual freshness indicators", "The physical age of the server hardware running the pipeline"], "correct": 0, "explanation": "Freshness checks compare the most recent timestamp in a table against an expected recency threshold (e.g. 'this table should never be more than 25 hours old'), catching a silently-stalled or broken upstream job before stale data misleads downstream consumers. It's about the actual recency of the DATA, unrelated to string formatting of date fields, dashboard color schemes, or the physical age of hardware."}, {"topic": "data-quality", "difficulty": "mid", "stem": "What is a 'schema validation' check designed to catch that a simple row count check would miss?", "options": ["Unexpected changes to column names, data types, or the presence/absence of expected columns, even if the row count looks normal", "Whether the pipeline finished within its allotted runtime", "Duplicate rows within the loaded data", "Whether the destination table has proper database indexes"], "correct": 0, "explanation": "A source could send the exact expected number of rows while a column got silently renamed, retyped, or dropped upstream — schema validation specifically checks structural conformance, a failure mode row counts alone are completely blind to. Runtime duration, duplicate detection, and index configuration are each handled by separate, distinct types of checks — schema validation is specifically about structure, not any of those other concerns."}, {"topic": "data-quality", "difficulty": "mid", "stem": "Why is it valuable to define explicit, automated 'range checks' for numeric columns (e.g. age between 0 and 120, price >= 0)?", "options": ["They catch clearly invalid or corrupted values (like a negative price or an age of 999) automatically, before they distort downstream aggregates and analyses", "Range checks are purely cosmetic and don't affect any actual analysis", "Range checks can only be applied to date columns, not other numeric types", "They automatically fix invalid values in place without any manual review"], "correct": 0, "explanation": "Nonsensical values (impossible ages, negative prices, physically implausible measurements) can badly skew averages, sums, and downstream model training if they slip through unnoticed — automated range checks act as an early, cheap tripwire specifically for this class of obviously-wrong values. Detecting bad values is a distinct step from FIXING them — a range check flags/quarantines the issue for investigation, it doesn't autonomously decide how to correct the data."}, {"topic": "data-quality", "difficulty": "mid", "stem": "What is a 'uniqueness constraint' check verifying, and why does it matter for a supposed primary-key column?", "options": ["That values in a column intended to be unique (like an ID) actually have no duplicates, since duplicates would break assumptions in downstream joins and aggregations", "That the column contains only unique values across the ENTIRE database, not just within one table", "Uniqueness checks only apply to string columns, never to numeric ID columns", "That the column has a unique name compared to all other columns in the table"], "correct": 0, "explanation": "If an ID column meant to be a primary key actually contains duplicates (often due to an upstream bug or a botched incremental load), any downstream join keyed on it can silently fan out rows and multiply aggregate values — catching duplicate keys early prevents that whole class of bug. The uniqueness constraint is scoped to that specific column/table, not to every column across the entire database — and it applies just as much to numeric ID columns as to string ones, in fact more commonly so."}, {"topic": "data-quality", "difficulty": "mid", "stem": "What distinguishes a data quality 'anomaly detection' check (e.g. statistical outlier flagging on daily row counts) from a fixed threshold check?", "options": ["Anomaly detection compares current behavior against a learned historical pattern/distribution, flagging unusual deviations even without a hardcoded fixed threshold", "Anomaly detection can only be applied to text data, never numeric metrics", "Fixed threshold checks are always strictly better and anomaly detection is never useful", "Anomaly detection requires manually setting a new threshold every single day"], "correct": 0, "explanation": "Rather than a static rule like 'alert if row count < 10,000', anomaly detection models the normal historical range/pattern for a metric (accounting for things like day-of-week seasonality) and flags statistically unusual deviations from that learned baseline — useful when a single fixed number can't capture normal variation well. It's actually well suited to NUMERIC metrics specifically (row counts, null rates, aggregate values) — that's its most common application, not a limitation to text data."}, {"topic": "data-quality", "difficulty": "tricky", "stem": "A data quality freshness check passes (data updated within the last hour), but a downstream dashboard still shows obviously stale numbers. What's a plausible gap in the check's coverage?", "options": ["The freshness check confirms new rows arrived, but doesn't verify the actual VALUES were correctly computed/updated — e.g. a bug could be inserting new rows with stale or duplicated values", "Freshness checks are completely useless and should never be implemented", "This scenario is impossible if a freshness check is in place and passing", "The dashboard tool itself must be fundamentally broken if this happens"], "correct": 0, "explanation": "A freshness check only confirms that SOME new data landed recently (e.g. a max(updated_at) timestamp looks recent) — it says nothing about whether the actual computed values in those new rows are correct, which is exactly the kind of subtle gap where a check can pass while a real problem persists (e.g. a transformation bug is duplicating yesterday's numbers into 'fresh' rows). This is precisely why relying on freshness checks alone is insufficient — value-level/business-logic checks are also needed, which is the point of the question, not evidence that freshness checks are worthless."}, {"topic": "data-quality", "difficulty": "mid", "stem": "Why do many data quality frameworks distinguish between a 'warning' severity check and a 'blocking/critical' severity check?", "options": ["Some issues (minor anomalies) should just alert the team for awareness, while others (e.g. a broken primary key) should actually halt the pipeline to prevent bad data from propagating downstream", "Severity levels have no functional difference; they're purely cosmetic labels", "Warnings are checked less frequently than critical checks, on a different schedule", "Critical checks can only be written by senior engineers"], "correct": 0, "explanation": "Not every anomaly warrants stopping the entire pipeline — tiering severity lets teams block on genuinely dangerous issues (corrupted keys, wildly wrong row counts) while just logging/alerting on softer anomalies that might be legitimate business variation, avoiding both alert fatigue and reckless pipeline halts. This is a functional distinction with real operational consequences (block vs. don't block), not just a cosmetic labeling choice, and it has nothing to do with who is authorized to author the checks."}]</script>
<script>
(function () {
  var raw = JSON.parse(document.getElementById('quiz-data').textContent);

  function shuffle(arr) {
    var a = arr.slice();
    for (var i = a.length - 1; i > 0; i--) {
      var j = Math.floor(Math.random() * (i + 1));
      var t = a[i]; a[i] = a[j]; a[j] = t;
    }
    return a;
  }

  // Shuffle question order, and shuffle each question's option order (remapping correct index).
  var questions = shuffle(raw).map(function (q) {
    var idx = q.options.map(function (_, i) { return i; });
    var shuffledIdx = shuffle(idx);
    var newOptions = shuffledIdx.map(function (i) { return q.options[i]; });
    var newCorrect = shuffledIdx.indexOf(q.correct);
    return {
      stem: q.stem,
      options: newOptions,
      correct: newCorrect,
      explanation: q.explanation,
      topic: q.topic || '',
      difficulty: q.difficulty || ''
    };
  });

  var total = questions.length;
  var current = 0;
  var score = 0;
  var answered = 0;

  var main = document.getElementById('main');
  var progressText = document.getElementById('progress-text');
  var scorePill = document.getElementById('score-pill');
  var progressFill = document.getElementById('progress-fill');

  function updateHeader() {
    progressText.textContent = 'Question ' + Math.min(current + 1, total) + ' of ' + total;
    scorePill.textContent = 'Score: ' + score + ' / ' + answered;
    progressFill.style.width = (Math.min(current, total) / total * 100) + '%';
  }

  function letter(i) { return String.fromCharCode(65 + i); }

  function renderQuestion() {
    if (current >= total) {
      renderSummary();
      return;
    }
    var q = questions[current];
    updateHeader();

    var card = document.createElement('div');
    card.className = 'card';

    var tagLine = [];
    if (q.topic) tagLine.push(q.topic);
    if (q.difficulty) tagLine.push(q.difficulty);
    var tagsDiv = document.createElement('div');
    tagsDiv.className = 'q-tags';
    tagsDiv.textContent = tagLine.join(' · ');
    card.appendChild(tagsDiv);

    var stem = document.createElement('p');
    stem.className = 'q-stem';
    stem.textContent = q.stem;
    card.appendChild(stem);

    var optsDiv = document.createElement('div');
    optsDiv.className = 'options';

    var feedback = document.createElement('div');
    feedback.className = 'feedback';

    var nextBtn = document.createElement('button');
    nextBtn.className = 'next-btn';
    nextBtn.textContent = current === total - 1 ? 'See results' : 'Next question';

    var buttons = [];
    q.options.forEach(function (opt, i) {
      var btn = document.createElement('button');
      btn.className = 'option';
      btn.textContent = letter(i) + '. ' + opt;
      btn.addEventListener('click', function () {
        buttons.forEach(function (b) { b.disabled = true; });
        var isCorrect = i === q.correct;
        answered++;
        if (isCorrect) {
          score++;
          btn.classList.add('correct');
        } else {
          btn.classList.add('incorrect');
          buttons[q.correct].classList.add('reveal-correct');
        }
        feedback.classList.add('show');
        feedback.classList.add(isCorrect ? 'right' : 'wrong');
        feedback.innerHTML = '<strong>' + (isCorrect ? 'Correct.' : 'Not quite.') + '</strong>' +
          escapeHtml(q.explanation);
        nextBtn.classList.add('show');
        updateHeader();
      });
      buttons.push(btn);
      optsDiv.appendChild(btn);
    });

    card.appendChild(optsDiv);
    card.appendChild(feedback);

    var navRow = document.createElement('div');
    navRow.className = 'nav-row';
    nextBtn.addEventListener('click', function () {
      current++;
      renderQuestion();
    });
    navRow.appendChild(nextBtn);
    card.appendChild(navRow);

    main.innerHTML = '';
    main.appendChild(card);
    window.scrollTo({ top: 0, behavior: 'smooth' });
  }

  function escapeHtml(s) {
    var div = document.createElement('div');
    div.textContent = s;
    return div.innerHTML;
  }

  function renderSummary() {
    progressText.textContent = 'Complete';
    progressFill.style.width = '100%';
    var pct = total ? Math.round((score / total) * 100) : 0;
    var div = document.createElement('div');
    div.className = 'card summary';
    div.innerHTML = '<h2>Quiz complete</h2>' +
      '<div class="big-score">' + score + ' / ' + total + '</div>' +
      '<div>' + pct + '% correct</div>';
    var btn = document.createElement('button');
    btn.textContent = 'Restart (new shuffle)';
    btn.addEventListener('click', function () { location.reload(); });
    div.appendChild(btn);
    main.innerHTML = '';
    main.appendChild(div);
  }

  renderQuestion();
})();
</script>
</body>
</html>
